
# MySQL database (configured via environment variables in production/Coolify)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# spring.datasource.url=jdbc:mysql://localhost:3306/zoo?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false
# spring.datasource.username=root
# spring.datasource.password=vinicius

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Explicit Hibernate dialect to avoid autodetection errors
# Use the generic MySQL dialect compatible with the Hibernate version in the project
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Also set Jakarta persistence URL to ensure Hibernate can read JDBC metadata
jakarta.persistence.jdbc.url=${SPRING_DATASOURCE_URL}

# Server port (optional)
# server.port=8080

# JWT
# Em produção, usar segredo forte via variável de ambiente.
app.jwt.secret=${JWT_SECRET:zoogestor-jwt-secret-change-this-in-production}
app.jwt.expiration-ms=28800000

